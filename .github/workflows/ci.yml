name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Build, test, selftest
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cd compiler && cargo test --all
      - name: Build dmc (release)
        run: cd compiler && cargo build --release
      - name: dmc selftest
        # Compiler-derived differential suite: generated programs run through
        # both backends (interpreter and JIT), diffed for divergence.
        run: compiler/target/release/dmc selftest
      - name: dmc test examples
        # The in-language ground-truth suite over the shipped examples.
        run: compiler/target/release/dmc test examples
      - name: dmc test --jit examples
        # Every JIT-eligible example test additionally runs on both backends
        # and the results are compared.
        run: compiler/target/release/dmc test --jit examples
