name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Build, test, selftest
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cd compiler && cargo test --all
      - name: Build dmc (release)
        run: cd compiler && cargo build --release
      - name: dmc selftest
        # Compiler-derived differential suite: generated programs run through
        # both backends (interpreter and JIT), diffed for divergence.
        run: compiler/target/release/dmc selftest
      - name: dmc test examples
        # The in-language ground-truth suite over the shipped examples.
        run: compiler/target/release/dmc test examples
      - name: dmc test --jit examples
        # Every JIT-eligible example test additionally runs on both backends
        # and the results are compared.
        run: compiler/target/release/dmc test --jit examples
      - name: validate_manifest.py
        # demoni.json stays consistent with the tree it ships in. The
        # existence test keeps this from passing vacuously if the manifest
        # ever drops out of the tree (the validator exits 0 on no matches).
        run: |
          test -s demoni.json
          python3 tools/validate_manifest.py
      - name: example_runner.py (per-example conformance)
        # Each example gated individually against tools/example_baseline.json
        # by its executable test results on both backends. To record a
        # genuinely-new passing example: python3 tools/example_runner.py
        # --accept-new, and commit the baseline change.
        run: python3 tools/example_runner.py
      - name: diff_backends.py (run-vs-jit whole-example diff)
        # Diffs full program output between the interpreter and the JIT. The
        # interpreter is the reference semantics, so any unexplained
        # divergence is a JIT bug.
        #
        # --timeout is explicit here because a timeout FAILS this gate (it is
        # its own bucket, never folded into a skip) and this runner is the
        # slowest machine the corpus meets. The slowest example that runs to
        # completion under `dmc run` is console/dv2.dmc, ~86 s on a quiet
        # M-series box; a 2-core hosted ubuntu-latest runner is several times
        # slower than that, so the 300 s default leaves no headroom and a
        # green corpus would go red on load alone. 900 s is ~10x the measured
        # cost and still an order of magnitude below the job's own limit, so
        # a genuine hang is still bounded and still reported.
        run: python3 tools/diff_backends.py --timeout 900
      - name: jit_probes.py (run-vs-jit edge-case battery)
        # Curated edge cases the example corpus does not reach.
        run: python3 tools/jit_probes.py
      - name: rss_gate.py (peak resident memory)
        # Every other gate here pins bytes CHARGED or program OUTPUT, so an
        # allocator change that touches every page of a chunk while charging
        # the same number passes all of them. This one measures the peak
        # resident set of three tiny runs against generous ceilings.
        run: python3 tools/rss_gate.py
      - name: lint_dmc.py
        # Style/consistency lints over the shipped .dmc corpus.
        run: python3 tools/lint_dmc.py
      - name: diff_fuzz.py (smoke)
        # Structure-aware interp-vs-jit differential fuzzer: generates
        # well-typed scalar programs, runs both backends, diffs.
        run: python3 tools/diff_fuzz.py --iters 2000 --meta-test
      - name: Install numpy
        run: pip install numpy
      - name: numpy_oracle.py
        # External source of truth: tensor ops checked against an independent
        # NumPy reimplementation (catches bugs shared by both backends).
        run: python3 tools/numpy_oracle.py --meta-test

  standalone-crate:
    name: Standalone crate (compiler/ alone)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The property: a bare copy of compiler/ alone — no examples/, no
      # docs/, no siblings — must build and test clean. It regresses
      # silently the next time a test reaches for a fixture by a ../ path;
      # this job makes that a red X instead.
      - name: Copy compiler/ alone to a temp dir
        run: |
          tmp="$(mktemp -d)"
          echo "STANDALONE_DIR=$tmp" >> "$GITHUB_ENV"
          git archive HEAD compiler | tar -x -C "$tmp"
      - name: cargo build + cargo test in the copy
        # An out-of-crate include_str! dies at compile time, a runtime
        # fixture read dies in its test; either way the error names the
        # escaping path.
        run: |
          cd "$STANDALONE_DIR/compiler"
          cargo build --release
          cargo test --all
